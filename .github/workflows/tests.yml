name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
        laravel: ['11.*', '12.*', '13.*']
        include:
          # Laravel 11 is past security support, so every 11.x release has an
          # advisory and Composer 2.9+ refuses to install it. Composer 2.8 still
          # installs it, so the package keeps being tested on Laravel 11.
          - laravel: '11.*'
            testbench: '9.*'
            composer: '2.8.12'
          - laravel: '12.*'
            testbench: '10.*'
            composer: 'v2'
          - laravel: '13.*'
            testbench: '11.*'
            composer: 'v2'
        exclude:
          - laravel: '13.*'
            php: '8.2'

    name: PHP ${{ matrix.php }} - Laravel ${{ matrix.laravel }}

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:${{ matrix.composer }}
          coverage: none

      - name: Install dependencies
        run: |
          composer require "illuminate/support:${{ matrix.laravel }}" "illuminate/http:${{ matrix.laravel }}" "illuminate/contracts:${{ matrix.laravel }}" --no-interaction --no-update
          composer require --dev "orchestra/testbench:${{ matrix.testbench }}" --no-interaction --no-update
          composer update --prefer-dist --no-interaction --no-progress

      - name: Run tests
        run: vendor/bin/phpunit

      # Laravel 11 is skipped: it is past security support and always has open advisories.
      - name: Audit dependencies
        if: matrix.laravel != '11.*'
        run: composer audit --no-interaction
